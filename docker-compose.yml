version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: property_postgres
    restart: always
    environment:
      POSTGRES_DB: propertydb
      POSTGRES_USER: propertyuser
      POSTGRES_PASSWORD: propertypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - propertynet

  redis:
    image: redis:latest
    container_name: property_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - propertynet

volumes:
  postgres_data:
  redis_data:

networks:
  propertynet:
